[package]
name = "moonread-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "moonread_core"
crate-type = ["lib", "staticlib", "cdylib"]

[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[[bin]]
name = "site-theme-data"
path = "src/bin/site-theme-data.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.12"
encoding_rs = "0.8.35"
# Detection changes are identity-sensitive: upgrades must pass the frozen corpus.
chardetng = "=1.0.0"
scraper = { version = "0.29", default-features = false }
url = "2.5"
sha2 = "0.11"
thiserror = "2"
uniffi = "0.32.2"
unicode-segmentation = "1.13.3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "ios")'.dependencies]
rusqlite = "0.40.2"

[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
