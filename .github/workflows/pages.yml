name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/pages.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'Cargo.*'
      - 'crates/moonread-core/Cargo.toml'
      - 'crates/moonread-core/src/user/themes.rs'
      - 'crates/moonread-core/src/reading/layout.rs'
      - 'crates/moonread-core/src/bin/site-theme-data.rs'
      - 'ios/Moonread/Localizable.xcstrings'
      - 'ios/Moonread/Assets.xcassets/ReaderTexture*/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check generated reader preview data
        run: nix develop --no-update-lock-file -c cargo run --locked -p moonread-core --bin site-theme-data -- --check
      - name: Build site
        working-directory: docs/site
        run: nix develop --no-update-lock-file -c zola build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/public
  deploy:
    # Both push and workflow_dispatch include repository.private in the payload.
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
