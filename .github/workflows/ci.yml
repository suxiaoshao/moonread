name: CI

on:
  pull_request:
    branches: [main, 'release/**', 'hotfix/**']
  push:
    branches: [main, 'release/**', 'hotfix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/build/cargo

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.scope.outputs.linux }}
      ios: ${{ steps.scope.outputs.ios }}
      site: ${{ steps.scope.outputs.site }}
      workflows: ${{ steps.scope.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the complete PR diff
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess
          # Pushes to main, release and hotfix branches and manual runs always check everything.
          all_checks = os.environ['EVENT_NAME'] != 'pull_request'
          paths = []
          if not all_checks:
              paths = subprocess.check_output([
                  'git', 'diff', '--name-only', '--no-renames', '-z',
                  os.environ['BASE_SHA'] + '...' + os.environ['HEAD_SHA'], '--',
              ]).split(b'\0')
          github = any(path.startswith(b'.github/') for path in paths)
          rust = any(path.startswith(b'crates/') or
                     (b'/' not in path and path.startswith((b'Cargo.', b'flake.')))
                     for path in paths)
          checks = {
              'linux': all_checks or github or rust,
              'ios': all_checks or github or rust or any(path.startswith((b'ios/', b'assets/icon/')) for path in paths),
              'site': all_checks or github or any(path.startswith(b'docs/site/') or path in (b'flake.nix', b'flake.lock') for path in paths),
              'workflows': all_checks or github,
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, enabled in checks.items():
                  output.write(f'{name}={str(enabled).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Check scope: ' + ', '.join(f'{k}={str(v).lower()}' for k, v in checks.items()) + '\n')
          PYTHON


  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Scan committed history for secrets
        run: nix develop --no-update-lock-file -c gitleaks git --redact --no-banner --log-opts=HEAD .

  workflows:
    name: Workflow syntax
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Check workflow syntax
        run: nix develop --no-update-lock-file -c actionlint

  site:
    name: Website checks
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.site == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Build site
        working-directory: docs/site
        run: nix develop --no-update-lock-file -c zola build

  linux:
    name: Linux checks
    needs: [changes, secrets, workflows]
    # Scope failure falls back to full checks; secret/workflow failures remain blocking.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.secrets.result != 'success' || needs.changes.outputs.linux == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require secret and workflow checks to pass
        if: ${{ needs.secrets.result != 'success' || (needs.workflows.result != 'success' && needs.workflows.result != 'skipped') }}
        run: |
          echo 'Secret scanning or workflow validation did not pass.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-linux-cargo
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}-${{ hashFiles('crates/**', 'Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}-
      - name: Check formatting
        run: |
          nix develop --no-update-lock-file -c cargo fmt --all -- --check
          nix develop --no-update-lock-file -c nixfmt --check flake.nix
      - name: Lint Rust
        id: rust-build
        run: nix develop --no-update-lock-file -c cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Save compiled Rust cache
        if: ${{ !cancelled() && steps.rust-build.outcome == 'success' && steps.restore-linux-cargo.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo
          key: ${{ steps.restore-linux-cargo.outputs.cache-primary-key }}
      - name: Test Rust
        run: nix develop --no-update-lock-file -c cargo test --locked --workspace --all-features

  ios-unit-tests:
    name: iOS unit tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ios == 'true') }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Xcode 27.1 and the existing iOS 27 simulator
        id: simulator
        run: |
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.1'
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/simulators.json') as source:
              devices = json.load(source)['devices']
          matches = [device['udid'] for runtime, entries in devices.items()
                     if runtime.endswith('.iOS-27-0')
                     for device in entries if device['name'] == 'iPhone 18 Pro' and device['isAvailable']]
          if not matches:
              raise SystemExit('Required iOS 27.0 iPhone 18 Pro simulator is unavailable; no fallback is allowed.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('udid=' + matches[0] + '\n')
          PY
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-ios-cargo
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo
          key: ios-cargo-${{ runner.arch }}-xcode27.1-${{ hashFiles('flake.lock', 'Cargo.lock') }}-${{ hashFiles('crates/**', 'Cargo.toml') }}
          restore-keys: ios-cargo-${{ runner.arch }}-xcode27.1-${{ hashFiles('flake.lock', 'Cargo.lock') }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-ios-derived
        with:
          path: build/DerivedData
          key: ios-derived-${{ runner.arch }}-xcode27.1-${{ hashFiles('flake.lock', 'Cargo.lock', 'ios/**/Package.resolved', 'ios/**/*.pbxproj') }}-${{ hashFiles('ios/**', 'crates/**') }}
          restore-keys: ios-derived-${{ runner.arch }}-xcode27.1-${{ hashFiles('flake.lock', 'Cargo.lock', 'ios/**/Package.resolved', 'ios/**/*.pbxproj') }}-
      - name: Compile MoonreadTests (Rust is built by the Nix Xcode phase)
        id: ios-build
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p build/CI
          nix develop --no-update-lock-file -c xcodebuild \
            -project ios/Moonread.xcodeproj -scheme Moonread -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData \
            -only-testing:MoonreadTests -parallel-testing-enabled NO \
            -testLanguage zh-Hans -testRegion CN \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES "MOONREAD_NIX=$(command -v nix)" build-for-testing \
            2>&1 | tee build/CI/BuildForTesting.log
      - name: Save compiled iOS Rust cache
        if: ${{ !cancelled() && steps.ios-build.outcome == 'success' && steps.restore-ios-cargo.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo
          key: ${{ steps.restore-ios-cargo.outputs.cache-primary-key }}
      - name: Save compiled iOS DerivedData cache
        if: ${{ !cancelled() && steps.ios-build.outcome == 'success' && steps.restore-ios-derived.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData
          key: ${{ steps.restore-ios-derived.outputs.cache-primary-key }}
      - name: Run all MoonreadTests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p build/CI
          # Xcode forwards TEST_RUNNER_* into the test process without the prefix.
          export TEST_RUNNER_CI="${CI:-false}"
          nix develop --no-update-lock-file -c xcodebuild \
            -project ios/Moonread.xcodeproj -scheme Moonread -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData -resultBundlePath build/CI/MoonreadTests.xcresult \
            -only-testing:MoonreadTests -parallel-testing-enabled NO \
            -testLanguage zh-Hans -testRegion CN \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES "MOONREAD_NIX=$(command -v nix)" -collect-test-diagnostics never test-without-building \
            2>&1 | tee build/CI/MoonreadTests.log
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MoonreadTests-${{ github.run_attempt }}
          path: build/CI
          if-no-files-found: ignore
          retention-days: 7
