name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/build/cargo

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}-${{ hashFiles('crates/**', 'Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}-
      - name: Scan committed history for secrets
        run: nix develop --no-update-lock-file -c gitleaks git --redact --no-banner --log-opts=HEAD .
      - name: Check formatting and workflow syntax
        run: |
          nix develop --no-update-lock-file -c cargo fmt --all -- --check
          nix develop --no-update-lock-file -c nixfmt --check flake.nix
          nix develop --no-update-lock-file -c actionlint
      - name: Lint Rust
        run: nix develop --no-update-lock-file -c cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test Rust
        run: nix develop --no-update-lock-file -c cargo test --locked --workspace --all-features
