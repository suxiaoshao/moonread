version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: release/1.2
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-rust-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/1.2
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
