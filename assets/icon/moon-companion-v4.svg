<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="moon-title moon-description">
  <title id="moon-title">月读 · 月海与圆月</title>
  <desc id="moon-description">完整正圆月体，较暗的灰银色。月海参照 NASA 月球正面影像作图标化概括，保留主要分布及少量近圆陨石坑。无眼睛、月相暗面或裁切，背景透明；不是精确月面地图。</desc>

  <g id="moon-body">
    <circle cx="512" cy="512" r="384" fill="#A5A79F" />
  </g>

  <g id="moon-maria" fill="#687485" fill-opacity="0.38">
    <!-- Upper-left basin and the broad western lava plains, simplified together. -->
    <path id="maria-northwest" d="M358 234C405 216 463 218 508 250C539 277 550 324 531 364C514 400 476 420 438 420C399 417 371 399 344 406C321 412 318 441 331 463C341 481 330 499 309 503C285 508 280 543 291 565C304 590 299 620 280 633C247 652 227 626 213 604C197 581 194 555 179 531C165 503 177 475 175 449C176 417 195 392 200 360C208 331 233 316 257 303C283 289 315 250 358 234Z" />

    <!-- The connected sequence of dark plains northeast of the center. -->
    <path id="maria-northeast" d="M583 275C607 257 647 265 670 287C689 307 692 339 677 361C668 375 675 391 696 395C727 399 752 419 770 446C785 469 782 491 765 508C751 522 744 527 748 547C751 567 735 591 713 595C684 599 668 580 667 558C667 539 649 533 631 526C610 518 600 499 609 479C619 456 640 449 636 429C633 412 612 407 590 401C560 393 544 368 544 338C544 312 558 289 583 275Z" />

    <!-- An isolated eastern basin is foreshortened near the lunar limb. -->
    <ellipse id="mare-east-isolated" cx="817" cy="397" rx="40" ry="55" transform="rotate(-12 817 397)" />

    <path id="mare-southeast" d="M783 505C806 489 829 504 840 529C854 558 850 590 831 615C815 637 794 632 787 609C781 590 764 578 766 555C768 535 771 517 783 505Z" />

    <path id="mare-southwest" d="M370 557C400 548 414 565 431 558C458 549 476 570 477 596C479 608 469 614 469 620C482 638 468 664 445 673C419 680 414 706 393 714C371 719 352 700 355 680C356 659 337 651 344 632C351 615 336 596 350 579C355 568 364 562 370 557Z" />

    <ellipse id="mare-west-small" cx="292" cy="671" rx="33" ry="42" transform="rotate(-25 292 671)" />

    <path id="mare-northern-strip" d="M374 204C416 180 470 181 520 188C551 193 577 186 599 184C614 183 625 190 619 200C601 216 570 222 539 216C489 209 442 213 402 223C382 227 367 218 374 204Z" />
  </g>

  <g id="moon-craters">
    <g id="crater-west-central">
      <circle cx="382" cy="449" r="17" fill="#687485" fill-opacity="0.25" stroke="#C0C2B9" stroke-opacity="0.4" stroke-width="3" />
    </g>
    <g id="crater-west">
      <circle cx="278" cy="457" r="9" fill="#687485" fill-opacity="0.2" stroke="#C0C2B9" stroke-opacity="0.35" stroke-width="2.5" />
    </g>
    <g id="crater-south">
      <circle cx="458" cy="775" r="11" fill="#687485" fill-opacity="0.23" stroke="#C0C2B9" stroke-opacity="0.4" stroke-width="2.5" />
    </g>
  </g>
</svg>
