      <stop stop-color="#B8B7AA" />
      <stop offset="0.55" stop-color="#A09F94" />
      <stop offset="1" stop-color="#787E89" />
    </linearGradient>
    <linearGradient id="moon-night" x1="718" y1="224" x2="602" y2="879" gradientUnits="userSpaceOnUse">
      <stop stop-color="#717D90" stop-opacity="0.32" />
      <stop offset="1" stop-color="#53617C" stop-opacity="0.66" />
    </linearGradient>
  </defs>

