<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc">
  <title id="title">月读：杏桃、薄荷、雾紫浅深配色草案</title>
  <desc id="desc">六张相同结构的配色样卡。只比较背景、表面、纸色、正文、次要文字与强调色，尚非最终主题或应用布局。</desc>
  <defs>
    <g id="sample" font-size="20" fill="currentColor">
      <text x="0" y="24">风从半开的窗里经过。</text>
      <text x="0" y="62">她翻过一页，屋子安静下来。</text>
      <text x="0" y="100">月光落在桌边，轻轻的。</text>
    </g>
  </defs>
  <rect width="1200" height="890" fill="#EAE8E4"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif">
