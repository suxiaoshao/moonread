    <text x="36" y="81" fill="#65636B" font-size="16">结构相同，浅深独立调色。颜色草案，尚未定稿。</text>
    <text x="36" y="120" fill="#65574F" font-size="20" font-weight="600">杏桃</text>
    <text x="420" y="120" fill="#426454" font-size="20" font-weight="600">薄荷</text>
    <text x="804" y="120" fill="#665378" font-size="20" font-weight="600">雾紫</text>

